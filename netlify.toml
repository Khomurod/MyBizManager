# Netlify configuration - HISTORICAL.
#
# Netlify was the production frontend until its free build credits ran out, and
# it no longer publishes `main`; the site still answers but serves a stale
# build. This file is kept only so the old host keeps behaving while a
# replacement is brought up, and should be deleted once it is.
#
# It is not a template for the next host. These rewrites exist because Netlify
# does not serve tasks.html at /tasks on its own; Cloudflare Pages does, and
# needs no equivalent configuration.

[[redirects]]
  from = "/tasks"
  to = "/tasks.html"
  status = 200

# The Telegram Mini App. Served at a clean /mini because the URL is registered
# with Telegram through setChatMenuButton and shows in the bot's menu.
[[redirects]]
  from = "/mini"
  to = "/mini.html"
  status = 200

[[redirects]]
  from = "/mini/"
  to = "/mini.html"
  status = 200

[[redirects]]
  from = "/tasks/"
  to = "/tasks.html"
  status = 200
