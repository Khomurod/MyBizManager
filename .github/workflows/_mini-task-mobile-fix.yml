name: Apply Mini App task mobile editor fix

on:
  push:
    branches:
      - fix/mini-task-mobile-editor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mini-task-mobile-editor
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_mini-task-mobile-fix.py
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/_mini-task-mobile-fix.yml scripts/_mini-task-mobile-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini.html assets/mini/05-tasks.js tests/miniapp-ui.e2e.js .github/workflows/_mini-task-mobile-fix.yml scripts/_mini-task-mobile-fix.py
          git commit -m "Fix Mini App task editor mobile layout"
          git push origin HEAD:fix/mini-task-mobile-editor
