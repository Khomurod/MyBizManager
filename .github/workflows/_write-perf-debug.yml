name: Capture write performance tests

on:
  push:
    branches: ["perf/write-path-responsiveness-clean"]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/write-path-responsiveness-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild generated bundle
        run: npm run build
      - name: Capture failing test context
        run: |
          set +e
          npm test > /tmp/write-perf-full.txt 2>&1
          code=$?
          {
            echo "EXIT_CODE=$code"
            echo "--- FAILURE CONTEXT ---"
            grep -B25 -A35 -E "not ok [0-9]+" /tmp/write-perf-full.txt || true
            echo "--- SUMMARY ---"
            tail -20 /tmp/write-perf-full.txt
          } > WRITE_PERF_TEST_OUTPUT_TMP.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WRITE_PERF_TEST_OUTPUT_TMP.txt
          git commit -m "Capture failing write-performance test context" || true
          git push origin HEAD:perf/write-path-responsiveness-clean
          exit 0
