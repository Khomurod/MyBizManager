name: Final documentation audit cleanup

on:
  push:
    branches:
      - docs/final-audit-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply final documentation cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          brief_path = Path('docs/APP_BRIEF.md')
          brief = brief_path.read_text()

          old = '''`TELEGRAM_WEBHOOK_SECRET`*, `TELEGRAM_AUTHORIZED_USER_ID`,\n`TELEGRAM_GROUP_CHAT_ID`, `TELEGRAM_TASKS_GROUP_CHAT_ID`,\n`TELEGRAM_WEBHOOK_URL`, `TELEGRAM_WEBHOOK_STATUS`, `TELEGRAM_LAST_SUCCESS`,\n`TELEGRAM_LAST_ERROR` (`*` = secret). They are project state, not code — the\ndeploy never touches them.\n'''
          new = '''`TELEGRAM_WEBHOOK_SECRET`*, `TELEGRAM_WEBHOOK_SECRET_PREVIOUS`* (transient\nduring rotation), `TELEGRAM_WEBHOOK_ROTATED_AT`, `TELEGRAM_AUTHORIZED_USER_ID`,\n`TELEGRAM_GROUP_CHAT_ID`, `TELEGRAM_TASKS_GROUP_CHAT_ID`,\n`TELEGRAM_WEBHOOK_URL`, `TELEGRAM_WEBHOOK_STATUS`, `TELEGRAM_LAST_SUCCESS`,\n`TELEGRAM_LAST_ERROR` (`*` = secret). They are project state, not code — the\ndeploy never touches them.\n'''
          if old not in brief:
              raise SystemExit('App Brief Script Properties anchor missing')
          brief = brief.replace(old, new, 1)

          old = '''| **Cloudflare Pages** (`mybizmanager.pages.dev`) | serves the static frontend from `main`, no build step; serves `/mini` and `/tasks` as clean paths with no config |\n\n**Netlify is not one of them.** The repository carries no Netlify\nconfiguration and `tests/static-analysis.test.js` keeps it that way. The old\n`omad-d` project is still linked to this repository on GitHub's side and still\nposts three neutral preview checks per pull request; they mean nothing about\nthis application. Removing it is a browser step — `docs/DEPLOYMENT.md` names\nexactly which.\n| **GitHub Actions + clasp** | the backend deployment pipeline |\n'''
          new = '''| **Cloudflare Pages** (`mybizmanager.pages.dev`) | serves the static frontend from `main`, no build step; serves `/mini` and `/tasks` as clean paths with no config |\n| **GitHub Actions + clasp** | the backend deployment pipeline |\n\n**Netlify is not one of them.** The repository carries no Netlify\nconfiguration and `tests/static-analysis.test.js` keeps it that way. The old\n`omad-d` project is still linked to this repository on GitHub's side and still\nposts three neutral preview checks per pull request; they mean nothing about\nthis application. Removing it is a browser step — `docs/DEPLOYMENT.md` names\nexactly which.\n'''
          if old not in brief:
              raise SystemExit('App Brief integration table anchor missing')
          brief = brief.replace(old, new, 1)
          brief_path.write_text(brief)

          arch_path = Path('docs/ARCHITECTURE.md')
          arch = arch_path.read_text()
          old = '| `TELEGRAM_WEBHOOK_SECRET_PREVIOUS` | **yes, transient** | Accepted only during a webhook-secret rotation, then cleared |\n| `TELEGRAM_WEBHOOK_STATUS` | no | JSON status snapshot |\n'
          new = '| `TELEGRAM_WEBHOOK_SECRET_PREVIOUS` | **yes, transient** | Accepted only during a webhook-secret rotation, then cleared |\n| `TELEGRAM_WEBHOOK_ROTATED_AT` | no | Timestamp of the last successfully verified webhook-secret rotation |\n| `TELEGRAM_WEBHOOK_STATUS` | no | JSON status snapshot |\n'
          if old not in arch:
              raise SystemExit('Architecture webhook properties anchor missing')
          arch_path.write_text(arch.replace(old, new, 1))

          # Final audit assertions for the documentation facts corrected here.
          brief = brief_path.read_text()
          arch = arch_path.read_text()
          for name in ('TELEGRAM_WEBHOOK_SECRET_PREVIOUS', 'TELEGRAM_WEBHOOK_ROTATED_AT'):
              if name not in brief or name not in arch:
                  raise SystemExit(f'{name} must be documented in both canonical references')
          integration = brief[brief.index('## 8. Integrations'):brief.index('## 9. Automatic and background behaviour')]
          if integration.index('| **GitHub Actions + clasp**') > integration.index('**Netlify is not one of them.**'):
              raise SystemExit('GitHub Actions integration row must stay inside the integrations table')
          PY
          npm run lint
          npm test
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-doc-audit-cleanup.yml
          git add docs/APP_BRIEF.md docs/ARCHITECTURE.md
          git commit -m "Finish documentation audit cleanup"
          git push
