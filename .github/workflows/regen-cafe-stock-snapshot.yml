name: One-shot cafe stock snapshot patch

on:
  push:
    branches: ["fix/cafe-void-stock-snapshot"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cafe-void-stock-snapshot
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply audited café consistency fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          cafe = 'apps-script/12_cafe.gs'

          replace_once(cafe,
          '''  return state.inventory;
          }

          /** The stored sale with this request id, if the request has already run. */''',
          '''  return state.inventory;
          }

          /**
           * Returns the exact stock movement frozen into a sale receipt.
           *
           * Recipes and product serving sizes can be edited after a sale. A void must
           * reverse what the sale actually consumed, not what today's catalogue says
           * the same menu item would consume. Receipts written before this snapshot
           * existed return null and keep the legacy re-resolution fallback below.
           */
          function cafeStoredStockConsumption_(detail) {
            if (!detail || typeof detail !== "object" ||
                !Object.prototype.hasOwnProperty.call(detail, "stockConsumption")) return null;

            var raw = detail.stockConsumption;
            if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;

            var clean = {};
            var ids = Object.keys(raw);
            for (var i = 0; i < ids.length; i++) {
              var id = String(ids[i] || "").trim();
              var movement = raw[ids[i]] || {};
              var qty = Number(movement.qty);
              var cost = Number(movement.cost);
              if (!id || !isFinite(qty) || qty < 0 || !isFinite(cost) || cost < 0) return null;
              clean[id] = { qty: qty, cost: cost };
            }
            return clean;
          }

          /** The stored sale with this request id, if the request has already run. */''')

          replace_once(cafe,
          '''      JSON.stringify({ requestId: requestId, items: resolved.lines }),''',
          '''      JSON.stringify({
                requestId: requestId,
                items: resolved.lines,
                // Freeze the exact quantity and cost removed from every inventory row.
                // A later recipe/serving-size edit must not change what a void restores.
                stockConsumption: resolved.consumption
              }),''')

          replace_once(cafe,
          '''    var current = cafeCatalogue_(configSheet);
              var restored = resolveCafeSaleLines_(current, cafeReceiptItems_(detail), { allowInactive: true });

              var inventory = current.inventory;''',
          '''    var current = cafeCatalogue_(configSheet);
              var storedConsumption = cafeStoredStockConsumption_(detail);
              var restored = storedConsumption !== null
                ? { consumption: storedConsumption }
                : resolveCafeSaleLines_(current, cafeReceiptItems_(detail), { allowInactive: true });

              var inventory = current.inventory;''')

          test_path = 'tests/cafe-authority.test.js'
          replace_once(test_path,
          '''  assert.strictEqual(post(gas, { action: 'get_cafe_data' }).sales.length, 0);
          });

          test('a void ignores any inventory the caller supplies', () => {''',
          '''  assert.strictEqual(post(gas, { action: 'get_cafe_data' }).sales.length, 0);
          });

          test('a void restores the sale-time recipe consumption after the recipe is edited', () => {
            const gas = boot();
            const sale = sell(gas, [{ kind: 'recipe', recipeId: 'r1', qty: 2 }]);

            assert.strictEqual(stock(gas, 'i2'), 4700, 'the sale used 300ml of milk');
            assert.strictEqual(stock(gas, 'i3'), 1964, 'the sale used 36g of coffee');

            // Change the live recipe after the receipt exists. Recomputing a void from
            // this new recipe would incorrectly restore 600ml of milk and only 20g of coffee.
            const catalogue = post(gas, { action: 'get_cafe_data', scope: 'admin' });
            const changed = post(gas, {
              action: 'save_recipe',
              expectedCatalogueRev: catalogue.catalogueRev,
              recipes: [{
                id: 'r1', name: 'Kapuchino', sellPrice: 25000, baseCost: 1000,
                ingredients: [
                  { inventoryId: 'i2', qty: 300 },
                  { inventoryId: 'i3', qty: 10 }
                ]
              }]
            });
            assert.strictEqual(changed.status, 'success', changed.message);

            const voided = post(gas, { action: 'void_sale', id: sale.sale.id });
            assert.strictEqual(voided.status, 'success');
            assert.strictEqual(voided.stockRestored, true);
            assert.strictEqual(stock(gas, 'i2'), 5000, 'only the 300ml actually sold came back');
            assert.strictEqual(stock(gas, 'i3'), 2000, 'the exact 36g actually sold came back');
          });

          test('a void ignores any inventory the caller supplies', () => {''')

          replace_once('docs/ARCHITECTURE.md',
          '''| `Cafe_Sales` | `[Sana, Sotuvchi, Jami_Tushum, Sof_Foyda, Chek_Tafsilotlari, ID]` |''',
          '''| `Cafe_Sales` | `[Sana, Sotuvchi, Jami_Tushum, Sof_Foyda, Chek_Tafsilotlari, ID]`; new receipt JSON freezes the exact per-inventory quantity/cost consumed so a later recipe edit cannot change what a void restores. Legacy receipts without that snapshot retain the compatibility fallback. |''')
          PY

      - name: Rebuild generated Apps Script bundle
        run: npm run build

      - name: Run focused café regression test
        run: node --test tests/cafe-authority.test.js

      - name: Run static validation
        run: npm run lint

      - name: Commit finished patch and remove this one-shot workflow
        run: |
          git rm .github/workflows/regen-cafe-stock-snapshot.yml
          git add apps-script/12_cafe.gs tests/cafe-authority.test.js docs/ARCHITECTURE.md script.gs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve exact cafe stock on sale void"
          git push origin HEAD:fix/cafe-void-stock-snapshot
