name: Temporary bundle regeneration

on:
  push:
    branches: ["fix/cafe-auth-rate-limit"]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[bundle]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cafe-auth-rate-limit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild generated Apps Script bundle
        run: npm run build

      - name: Commit generated bundle if changed
        run: |
          if git diff --quiet -- script.gs; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.gs
          git commit -m "Rebuild Apps Script bundle [bundle]"
          git push origin HEAD:fix/cafe-auth-rate-limit
