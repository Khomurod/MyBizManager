name: Finalize legacy fallback retry guard

on:
  push:
    branches:
      - fix/write-performance-audit-hardening

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard old-backend fallback retries
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
      - name: Verify full suite
        shell: bash
        run: |
          npm run build
          npm run build:check
          npm run lint
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          git diff --check
      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fallback-retry-guard.yml
          git add assets/omad/12-app.js tests/omad-ledger.e2e.js docs/ARCHITECTURE.md
          git commit -m "Guard uncertain legacy fallback retries"
          git push
