name: Complete write-performance docs

on:
  push:
    branches:
      - docs/complete-write-performance-brief

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete App Brief module map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/APP_BRIEF.md')
          text = path.read_text()

          replacements = {
              "| `12a_cafe_catalogue.gs` | Recipe costing, catalogue revision, health warnings, stock movements |\n":
              "| `12a_cafe_catalogue.gs` | Recipe costing, catalogue revision, health warnings, stock movements |\n"
              "| `12b_cafe_write_performance.gs` | Faster durable café sale retry lookup without changing stock or idempotency rules |\n",
              "| `14_ledger.gs` | Append-only ledger: create / correct / cancel / read / audit |\n":
              "| `14_ledger.gs` | Append-only ledger: create / correct / cancel / read / audit |\n"
              "| `14a_ledger_write_performance.gs` | Fast ledger request lookup / ID allocation and atomic multi-line entry creation |\n",
              "| `20_api.gs` | `doPost` / `doGet` routing and the auth gates only |\n":
              "| `20_api.gs` | `doPost` / `doGet` routing and the auth gates only |\n"
              "| `20a_write_performance_api.gs` | Batch-ledger API extension with rollout-safe fallback semantics |\n",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected App Brief anchor missing: {old!r}')
              if new.splitlines()[-1] in text:
                  continue
              text = text.replace(old, new, 1)

          path.write_text(text)

          # Backend module map should actually be complete, not just contain the
          # three files from the latest change.
          modules = sorted(p.name for p in Path('apps-script').glob('*.gs'))
          missing = [name for name in modules if f'`{name}`' not in text]
          if missing:
              raise SystemExit('Backend modules missing from App Brief: ' + ', '.join(missing))

          print(f'App Brief lists all {len(modules)} Apps Script modules.')
          PY
      - name: Verify documentation-only diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "docs/APP_BRIEF.md" || {
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          }
      - name: Commit documentation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-write-perf-docs.yml
          git add docs/APP_BRIEF.md
          git commit -m "Complete write-performance module documentation"
          git push
