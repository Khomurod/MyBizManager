name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets an already-merged commit be deployed without pushing an empty one, and
  # is the normal way to retry after correcting a secret. The deploy job still
  # refuses any ref but main.
  workflow_dispatch:

jobs:
  static:
    name: Static analysis & secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apps Script bundle is up to date
        run: npm run build:check

      - name: Syntax validation & duplicate-function detection
        run: npm run lint

      - name: Secret detection (working tree)
        run: npm run scan:secrets

      - name: Secret detection (full git history)
        run: npm run scan:secrets:history

  unit:
    name: Unit & calculation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Automated tests
        run: npm test

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

  # ---------------------------------------------------------------- production
  # Updates the code inside the EXISTING Apps Script project and moves the
  # EXISTING deployment on to a new version, so the web-app URL, the Telegram
  # webhook and every Script Property stay exactly as they are. It never
  # creates a project or a deployment.
  #
  # Reached only from main, and only once the build, static analysis, secret
  # scans, unit tests and browser tests have all passed. A pull request or a
  # feature branch cannot get here: workflow_dispatch runs against a chosen ref
  # and the refs/heads/main test rejects every other one.
  #
  # There is deliberately no enable switch. Missing or invalid credentials make
  # this job FAIL, in the first step and with a message naming what is absent.
  # An earlier version gated on `vars.APPS_SCRIPT_DEPLOY_ENABLED`, which turned
  # a mis-scoped value — a secret of that name, or an environment-level
  # variable, neither of which the `vars` context can see from a job-level
  # `if:` — into a job that skipped silently and for ever.
  deploy:
    name: Deploy to Apps Script
    needs: [static, unit, browser]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Two merges landing seconds apart must not interleave a push with another
    # push's version. Queued rather than cancelled: abandoning a run between
    # `clasp push` and `update-deployment` would leave new code unreleased.
    concurrency:
      group: apps-script-production
      cancel-in-progress: false
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.CLASP_JSON }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
      APPS_SCRIPT_ALLOW_REMOTE_DRIFT: ${{ vars.APPS_SCRIPT_ALLOW_REMOTE_DRIFT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install --no-save @google/clasp@3.3.0

      # Fails closed: no credentials, no deployment.
      - name: Validate deployment configuration
        run: node scripts/clasp-deploy.js preflight

      # The live project's own manifest is the only manifest. Pulling is also
      # the first real authentication check.
      - name: Fetch the live project
        run: "$GITHUB_WORKSPACE/node_modules/.bin/clasp pull"
        working-directory: .clasp-work/pull

      - name: Combine the live manifest with the modular sources
        run: node scripts/clasp-deploy.js stage

      - name: Preflight — files that will be uploaded
        run: "$GITHUB_WORKSPACE/node_modules/.bin/clasp show-file-status"
        working-directory: .clasp-work/push

      - name: Push apps-script/ to the existing project
        run: "$GITHUB_WORKSPACE/node_modules/.bin/clasp push -f"
        working-directory: .clasp-work/push

      - name: Version this commit and move the existing deployment
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: node scripts/clasp-deploy.js release
