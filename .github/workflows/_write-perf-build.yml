name: Validate final write performance

on:
  push:
    branches: ["perf/write-path-responsiveness-clean"]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/write-path-responsiveness-clean
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build bundle and run tests
        run: |
          npm run build
          npm test
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- script.gs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.gs
          git commit -m "Regenerate Apps Script after write-performance hardening"
          git push origin HEAD:perf/write-path-responsiveness-clean
